# MiniCPM-o 4.5 deploy: 3-GPU layout (thinker TP=2, talker + code2wav on GPU 2).
#
# Stage 0 (thinker): GPU 0,1 — 2-way tensor parallel, ~70% mem each.
# Stage 1 (talker) : GPU 2   — MiniCPMTTS codec generation.
# Stage 2 (code2wav): GPU 2  — batched codec-to-waveform generation.
pipeline: minicpmo_4_5
async_chunk: true

trust_remote_code: true
enable_prefix_caching: false

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 25
      codec_left_context_frames: 3

stages:
  - stage_id: 0
    max_num_seqs: 16
    gpu_memory_utilization: 0.7
    enforce_eager: false
    tensor_parallel_size: 2
    max_num_batched_tokens: 16384
    devices: "0,1"
    limit_mm_per_prompt:
      video: 1
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 2048
      seed: 42
      detokenize: true
      repetition_penalty: 1.1

  - stage_id: 1
    max_num_seqs: 1
    gpu_memory_utilization: 0.45
    enforce_eager: true
    max_num_batched_tokens: 8192
    devices: "2"
    output_connectors:
      to_stage_2: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      min_tokens: 50
      max_tokens: 2048
      stop_token_ids: [1]
      seed: 42
      detokenize: false

  - stage_id: 2
    max_num_seqs: 1
    gpu_memory_utilization: 0.45
    enforce_eager: true
    enable_chunked_prefill: false
    max_num_batched_tokens: 65536
    max_model_len: 65536
    devices: "2"
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      detokenize: true

platforms: {}
