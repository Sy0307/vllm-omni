# pi0.5 VLA deploy: single diffusion stage.
#
# pi0.5 takes multi-camera images + a language instruction + robot state and
# emits a continuous action chunk [chunk_size, max_action_dim]. Unlike pi0, the
# robot state is normalized/discretized into the language prompt before the
# action expert runs.

pipeline: pi05
async_chunk: false
distributed_executor_backend: mp
dtype: bfloat16

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    enforce_eager: true
    model_class_name: Pi05Pipeline
    model_config:
      paligemma_variant: gemma_2b
      action_expert_variant: gemma_300m
      chunk_size: 50
      max_action_dim: 32
      max_state_dim: 32
      num_inference_steps: 10
      image_resolution: [224, 224]
      tokenizer_max_length: 200
      max_cameras: 3
      state_num_bins: 256
      image_feature_keys:
        - observation.images.base_0_rgb
        - observation.images.left_wrist_0_rgb
        - observation.images.right_wrist_0_rgb
      image_key_map: {}
      norm_stats:
        action:
          mode: min_max
          min: [-0.0736, -0.9587, 0.6826, -0.2025, -0.8376, -0.3375, 0.1531,
                -0.3405, -1.0400, 0.4694, -1.4450, -1.0155, -1.3622, 0.1409]
          max: [0.0414, -0.1043, 1.2471, 0.0123, -0.2638, 0.1304, 1.1415,
                0.3313, 0.2792, 1.2931, 0.2500, 0.6121, 1.2210, 1.2004]
      state_norm_stats:
        mode: quantile
        q01: [-0.0741, -0.96, 0.6854, -0.2194, -0.8237, -0.3382, 0.0,
              -0.3404, -1.0634, 0.4588, -1.4444, -1.0057, -1.3615, 0.0]
        q99: [0.0403, -0.1035, 1.2505, 0.0121, -0.2629, 0.1309, 1.0182,
              0.3298, 0.2697, 1.2962, 0.2483, 0.6168, 1.2217, 1.1637]
      policy_server_config:
        image_resolution: [224, 224]
        n_external_cameras: 1
        needs_wrist_camera: true
        needs_stereo_camera: false
        needs_session_id: false
        action_space: joint_position
        action_horizon: 50
        action_dim: 32
        max_cameras: 3
