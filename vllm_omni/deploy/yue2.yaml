# YuE2-3B deploy: single-stage native-AR text-to-music (~3.6B bf16 + VAE).
# Four-slot CUDA configuration; validate memory on the target card/workload.
#
# The architectures pin is required: the checkpoint's config.json names
# "YuE2ForCausalLM" with an auto_map that only makes sense under
# trust_remote_code, so the deploy pins vLLM to this package's model class.
# model_type stays "yue2" so the registered Yue2Config is used; no
# trust_remote_code is needed (the registered config/model win over the
# checkpoint's auto_map).
pipeline: yue2
async_chunk: false
dtype: bfloat16

stages:
  - stage_id: 0
    # A finishing song keeps its slot during side-stream synthesis (emitting
    # HOLD tokens meanwhile). On one
    # H200 the synthesis pass saturates the GPU at about 32 songs in flight,
    # and more slots only add hold steps (120 s songs, gpu_memory_utilization
    # 0.5: 54 audio s/s at 32 concurrent requests; at 64 concurrent, 56 with
    # 32 slots vs 50 with 64), so raise this to 32 there, not higher.
    max_num_seqs: 4
    # Reserve synthesis headroom: NAR K/V, acoustic graph buffers and VAE
    # activations are allocated beyond the engine budget. The earlier 4090
    # memory measurement predates async/compiled synthesis; 0.70 is a starting
    # point, not a guarantee for 9000 frames or long ABC prefixes. Lower it if
    # the target workload needs more synthesis memory (see the model recipe).
    gpu_memory_utilization: 0.70
    # Keep AR capture off in the smaller-card default. Sampler/NAR graphs
    # still need separate synthesis headroom. Use yue2_h200.yaml for the
    # tested 32-slot FULL_AND_PIECEWISE AR profile.
    enforce_eager: true
    # Prefix caching stays off: the omni prefix-cache save snapshots the
    # step's mm payload before the model-owned sampler runs, but YuE2
    # appends the decoded waveform inside sample() (the terminal NAR/VAE
    # pass), so the cached payload would ship empty audio. Re-enable once
    # the runner saves post-sample.
    enable_prefix_caching: false
    max_num_batched_tokens: 24576
    max_model_len: 24576
    devices: "0"
    # The checkpoint ships no HF tokenizer files (only qwen.tiktoken, which
    # the offline driver reads itself); every prompt arrives as token ids,
    # so the engine builds no tokenizer. Placeholder tokenizer dir follows
    # the indextts2 precedent.
    skip_tokenizer_init: true
    tokenizer: gpt2
    hf_overrides:
      architectures: ["Yue2ForCausalLM"]
    default_sampling_params:
      # Placeholder values: the model's own sampler overrides everything from
      # extra_args. Their presence turns on has_sampling_extra_args, which is
      # what threads the per-request yue2_* keys into prepare_runner_inputs.
      extra_args:
        yue2_phase: "semantic"
        yue2_seed: 831001
        yue2_max_audio_frames: 200
        yue2_max_hold_steps: 4096
      detokenize: false
      stop_token_ids: [151848, 151852]  # ABC_END, MUSIC_END
      # 200 frames + 4096 synthesis holds + the final end token. Callers
      # changing the frame budget must also reserve this token headroom.
      max_tokens: 4297
      temperature: 1.0
