# YuE2-3B: single-H200 throughput profile, tested with 120 s song budgets.
# Select a free physical GPU with CUDA_VISIBLE_DEVICES; devices is logical.
# NAR/VAE buffers and model-owned graphs allocate beyond the engine budget.
pipeline: yue2
async_chunk: false
dtype: bfloat16

stages:
  - stage_id: 0
    # NAR saturates at about 32 songs; more slots add HOLD work.
    max_num_seqs: 32
    gpu_memory_utilization: 0.5
    enforce_eager: false
    compilation_config:
      cudagraph_mode: FULL_AND_PIECEWISE
    # Audio is appended in sample(), after the prefix-cache payload snapshot.
    enable_prefix_caching: false
    max_num_batched_tokens: 24576
    max_model_len: 24576
    devices: "0"
    skip_tokenizer_init: true
    tokenizer: gpt2
    hf_overrides:
      architectures: ["Yue2ForCausalLM"]
    default_sampling_params:
      extra_args:
        yue2_phase: "semantic"
        yue2_seed: 831001
        yue2_max_audio_frames: 200
        yue2_max_hold_steps: 4096
      detokenize: false
      stop_token_ids: [151848, 151852]  # ABC_END, MUSIC_END
      # Covers the default 200 frames, completion and HOLD budget.
      max_tokens: 4297
      temperature: 1.0
