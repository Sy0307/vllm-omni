<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>MiniCPM-o 4.5 Voice</title>
    <link rel="stylesheet" href="static/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Experimental full-duplex voice</p>
          <h1>MiniCPM-o <span>4.5</span></h1>
        </div>
        <span id="connectionState" class="status status-offline">Offline</span>
      </header>

      <main>
        <section class="call-bar" aria-label="Session controls">
          <div class="call-actions">
            <button id="callButton" class="primary" type="button">Start session</button>
            <button id="muteButton" class="secondary" type="button" disabled>Mute</button>
            <button id="cameraButton" class="secondary" type="button" disabled>Camera</button>
            <video id="cameraPreview" class="camera-preview" muted playsinline style="display:none"></video>
          </div>
          <label class="prompt-control">
            <span>Prompt</span>
            <select id="promptPreset">
              <option value="omni" selected>Omni (official omni preset)</option>
              <option value="chinese_call">中文通话 (official audio preset)</option>
              <option value="english_call">English Call (official audio preset)</option>
              <option value="custom">Custom</option>
            </select>
          </label>
          <label id="promptEditor" class="prompt-editor" hidden>
            <span>System prompt</span>
            <textarea id="systemPrompt" rows="2" placeholder="System prompt">Streaming Omni Conversation.</textarea>
          </label>
        </section>

        <section
          id="microphoneRail"
          class="duplex-rail"
          aria-label="Microphone and duplex status"
        >
          <div class="mic-glyph" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <rect x="8" y="3" width="8" height="12" rx="4"></rect>
              <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M8.5 21h7"></path>
            </svg>
          </div>
          <div class="mic-signal">
            <div class="mic-signal-heading">
              <strong>Your microphone</strong>
              <span><span id="captureRate">16 kHz</span> · <span id="sessionTimer">00:00</span></span>
            </div>
            <div id="micBars" class="mic-bars" aria-hidden="true">
              <i class="mic-bar"></i><i class="mic-bar"></i><i class="mic-bar"></i>
              <i class="mic-bar"></i><i class="mic-bar"></i><i class="mic-bar"></i>
              <i class="mic-bar"></i><i class="mic-bar"></i><i class="mic-bar"></i>
              <i class="mic-bar"></i><i class="mic-bar"></i><i class="mic-bar"></i>
              <i class="mic-bar"></i><i class="mic-bar"></i><i class="mic-bar"></i>
              <i class="mic-bar"></i><i class="mic-bar"></i><i class="mic-bar"></i>
            </div>
          </div>
          <div class="duplex-state">
            <strong id="modelState">Idle</strong>
            <span id="playbackState">Mic closed</span>
          </div>
        </section>

        <section class="conversation-section" aria-labelledby="conversationTitle">
          <div class="section-heading">
            <h2 id="conversationTitle">Conversation</h2>
            <span class="policy-label">Model-controlled listen / speak</span>
          </div>
          <div id="conversation" class="conversation" aria-live="polite">
            <p id="emptyConversation" class="empty-state">Start a session and speak naturally.</p>
          </div>
        </section>

        <section class="diagnostics" aria-label="Event log">
          <div class="log-summary">
            <div class="log-meta">
              <strong>Event log</strong>
              <span id="eventCount" class="event-count">0 events</span>
              <span id="runtimeDetail">No active connection</span>
            </div>
            <button
              id="toggleLogButton"
              class="log-toggle"
              type="button"
              aria-expanded="false"
              aria-controls="eventLogPanel"
            >Show event log</button>
          </div>
          <div id="eventLogPanel" class="log-panel" hidden>
            <div class="log-toolbar">
              <span>Runtime events</span>
              <button id="clearLogButton" class="icon-button" type="button" title="Clear event log">Clear</button>
            </div>
            <pre id="eventLog" class="event-log" aria-live="polite"></pre>
          </div>
        </section>
      </main>
    </div>

    <script>window.FULL_DUPLEX_CONFIG = __FULL_DUPLEX_CONFIG__;</script>
    <script src="static/app.js?v=__FULL_DUPLEX_APP_VERSION__"></script>
  </body>
</html>
